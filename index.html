<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  width:100%; height:100%; height:100dvh; overflow:hidden;

}
#app {

  padding:calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 6px);
}
.hide { display:none !important; }

/* ===== 首页 ===== */

/* ===== 矮横屏适配：浏览器地址栏挤压可用高度时的紧凑布局 ===== */

}

/* ===== 游戏区 ===== */
#game { flex:1; display:flex; flex-direction:column; min-height:0; }
#hud {
  display:flex; justify-content:center; align-items:center;

}
.stat {
  display:flex; align-items:baseline; gap:5px;

}

}

#main { flex:1; display:flex; align-items:center; gap:10px; min-height:0; }
#stage {
  position:relative; flex:1; height:100%;
  display:flex; align-items:center; justify-content:center; min-width:0;
}
#board { border-radius:12px; background:#1e1e2e; box-shadow:0 4px 20px rgba(0,0,0,.5); display:block; }

#overlay {
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; background:rgba(10,10,18,.86); border-radius:12px; text-align:center; padding:16px;
}
#ovTitle { font-size:22px; font-weight:bold; color:#eef; }
#ovTitle .w1 { color:#7ee6a8; }
#ovTitle .w2 { color:#ffb15e; }

  margin-top:4px; padding:11px 32px; border:none; border-radius:30px;
  background:linear-gradient(135deg,#4ade80,#22c55e);
  color:#0b2d18; font-size:16px; font-weight:bold;
  box-shadow:0 4px 16px rgba(74,222,128,.4);
}

#toast {
  position:absolute; top:12%; left:50%;
  transform:translate(-50%,0) scale(.4);
  padding:8px 22px; border-radius:30px;
  font-size:19px; font-weight:bold; color:#fff;
  background:linear-gradient(135deg,#ff6b9d,#ff8a5b);
  box-shadow:0 6px 22px rgba(255,107,157,.5);
  opacity:0; pointer-events:none; white-space:nowrap; z-index:5;
}
#toast.pop { animation:pop 1s ease-out forwards; }
@keyframes pop {
  0%   { opacity:0; transform:translate(-50%,14px) scale(.4); }
  18%  { opacity:1; transform:translate(-50%,-4px) scale(1.18); }
  32%  { transform:translate(-50%,0) scale(1); }
  72%  { opacity:1; transform:translate(-50%,-16px) scale(1); }
  100% { opacity:0; transform:translate(-50%,-40px) scale(.9); }
}

/* 摇杆 */
#pad { flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:8px; }
#pad .pname { font-size:12px; color:#8b8ba7; }
#joystick {
  position:relative; width:118px; height:118px; border-radius:50%;

}
#joyBase { position:absolute; inset:0; border-radius:50%; }
#joyBase::before, #joyBase::after { content:''; position:absolute; background:rgba(255,255,255,.07); }
#joyBase::before { left:50%; top:10px; bottom:10px; width:2px; transform:translateX(-50%); }
#joyBase::after  { top:50%; left:10px; right:10px; height:2px; transform:translateY(-50%); }
#joyKnob {
  position:absolute; width:48px; height:48px;
  left:50%; top:50%; margin-left:-24px; margin-top:-24px;
  border-radius:50%; pointer-events:none; will-change:transform;
  background:linear-gradient(135deg,#6ee7b7,#22c55e);
  box-shadow:0 4px 14px rgba(34,197,94,.5);
}
#joystick.active #joyKnob { filter:brightness(1.3); }

#rotateTip {
  display:none; position:absolute; top:0; left:0; right:0; z-index:60;
  background:rgba(255,213,79,.14); color:#ffd45e;
  padding:7px 12px; font-size:13px; text-align:center;
  align-items:center; justify-content:center;
}
</style>

<body>
<div id="app">

  <!-- 首页 -->
  <div id="menu">
    <h1>贪吃蛇 · 联机对战</h1>
    <div class="sub">两台手机各扫一个码，实时对战</div>
    <div class="mcard">
      <button class="mbtn" id="btnHost">创建房间（我是房主）</button>
      <a class="mbtn alt" href="doudizhu.html" style="display:block;text-align:center;text-decoration:none;width:min(340px,90vw);margin:0 auto;padding:13px;font-size:16px;font-weight:bold;border-radius:14px;box-sizing:border-box">🂡 斗地主（三人联机）</a>
    <div id="roomBox" class="hide">
        房间码（发给对手）
        <b id="roomCode">----</b>
        <span id="waitTip" style="color:#ffd45e">等待对手加入…</span>
      </div>
    </div>
    <div class="mcard">
      <input id="inCode" placeholder="房间码" maxlength="4" inputmode="numeric">
      <button class="mbtn alt" id="btnJoin">加入房间</button>
    </div>
    <div id="netTip"></div>
  </div>

  <!-- 游戏区 -->
  <div id="game" class="hide">
    <div id="hud">
      <div class="stat" id="st1"><span class="k">P1</span><span class="v" id="p1score">0</span></div>
      <button class="cbtn" id="btnStart2">开始</button>
      <button class="cbtn hide" id="btnWrap">穿墙：关</button>
      <button class="cbtn" id="btnRestart">重开</button>
      <button class="cbtn" id="btnFs">全屏</button>
      <span id="timer" class="cbtn" style="min-width:62px;text-align:center">03:00</span>
      <div class="stat p2" id="st2"><span class="k">P2</span><span class="v" id="p2score">0</span></div>
      <span id="roomTag"></span>
    </div>
    <div id="main">
      <div id="stage">
        <canvas id="board"></canvas>
        <div id="toast"></div>
        <div id="overlay">
          <div id="ovTitle">等待中</div>
          <div id="ovTip"></div>
          <button id="btnStart">开始对战</button>
        </div>
      </div>
      <div id="pad">
        <div class="pname">你</div>
        <div id="joystick">
          <div id="joyBase"></div>
          <div id="joyKnob"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="rotateTip">📱 竖屏也能玩，横屏体验更佳</div>
</div>

<script>
(function () {
  'use strict';

  var COLS = 28, ROWS = 16;
  var BASE_INTERVAL = 230, MIN_INTERVAL = 140, SPEED_STEP = 5;
  var FOOD_PER_LEVEL = 5, SCORE_PER_FOOD = 10, FOOD_COUNT = 3;
  var GAME_SECONDS = 180;
  var PRAISES = ['真棒', '非常厉害', '天神下凡', '大小姐驾到统统闪开', '一刀999', '同学办校园卡吗'];

  // DOM
  var elMenu = document.getElementById('menu'), elGame = document.getElementById('game');
  var canvas = document.getElementById('board'), ctx = canvas.getContext('2d');
  var stage  = document.getElementById('stage');
  var elP1 = document.getElementById('p1score'), elP2 = document.getElementById('p2score');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle'), ovTip = document.getElementById('ovTip');
  var btnStart = document.getElementById('btnStart'), btnStart2 = document.getElementById('btnStart2');
  var btnRestart = document.getElementById('btnRestart'), btnWrap = document.getElementById('btnWrap'), btnFs = document.getElementById('btnFs');
  var toast = document.getElementById('toast');
  var joy = document.getElementById('joystick'), knob = document.getElementById('joyKnob');
  var btnHost = document.getElementById('btnHost'), btnJoin = document.getElementById('btnJoin');
  var inCode = document.getElementById('inCode');
  var roomBox = document.getElementById('roomBox'), roomCodeEl = document.getElementById('roomCode');
  var waitTip = document.getElementById('waitTip'), netTip = document.getElementById('netTip');
  var roomTag = document.getElementById('roomTag');
  var elTimer = document.getElementById('timer');
  var rotateTip = document.getElementById('rotateTip');

  // 联机状态
  var mode = null;          // 'host' | 'client'
  var peer = null, conn = null;
  var mySlot = 0;           // host=0(P1) client=1(P2)
  var opponentJoined = false;

  // 游戏状态（host 权威；client 由收到的 state 填充）
  var players = [
    { name:'P1', body:[150,230,165], head:[32,130,76], snake:[], dir:'right', nextDir:'right', score:0, eaten:0, alive:true, deadMsg:'' },
    { name:'P2', body:[255,190,110], head:[200,110,30], snake:[], dir:'left', nextDir:'left', score:0, eaten:0, alive:true, deadMsg:'' }
  ];
  var foods = [];
  var status = 'ready';
  var wrapOn = false;
  var lastTime = 0, acc = 0, interval = BASE_INTERVAL;
  var cell = 20, tick = 0, praiseIndex = 0;
  var endTime = 0, timeLeft = GAME_SECONDS, gameStarted = false;

  // ================= 工具 =================
  function netMsg(t) { netTip.textContent = t; }

  // ================= 联机 =================
  function genCode() {
    var s = '';
    for (var i = 0; i < 4; i++) s += Math.floor(Math.random() * 10);
    return s;
  }

  function beHost() {
    mode = 'host'; mySlot = 0;
    var code = genCode();
    peer = new Peer('ssna-' + code, { debug: 1 });

    peer.on('open', function () {
      roomBox.classList.remove('hide');
      roomCodeEl.textContent = code;
      netMsg('');
    });
    peer.on('error', function (err) {
      if (err.type === 'unavailable-id') { peer.destroy(); beHost(); return; }  // 房间码撞了，换一个
      netMsg('网络错误：' + err.type + '，请刷新重试');
    });
    peer.on('connection', function (c) {
      if (conn && conn.open) { c.close(); return; }   // 只允许一个对手
      conn = c;
      bindConn();
    });
  }

  function joinRoom() {
    var code = (inCode.value || '').trim();
    if (!/^\d{4}$/.test(code)) { netMsg('请输入 4 位数字房间码'); return; }
    if (peer && peer.destroy) { try { peer.destroy(); } catch (e) {} }
    mode = 'client'; mySlot = 1;
    netMsg('连接中…');
    peer = new Peer({ debug: 1 });
    var tries = 0, maxTries = 3;
    peer.on('open', function () { tryConnect(); });
    peer.on('error', function (err) {
      if (err.type === 'peer-unavailable') {
        if (tries < maxTries) { netMsg('连接中…(第' + tries + '次)'); tryConnect(); }
        else netMsg('房间不存在：确认对方房间仍开着、房间码正确');
      } else netMsg('网络错误：' + err.type + '，刷新重试');
    });
    function tryConnect() {
      if (tries >= maxTries) return;
      tries++;
      conn = peer.connect('ssna-' + code, { reliable: true });
      bindConn();
      setTimeout(function () {
        if (conn && conn.open) return;
        if (tries < maxTries) { netMsg('连接中…(第' + tries + '次)'); tryConnect(); }
        else netMsg('连不上：确认对方房间仍开着、房间码正确，或双方换网络试试');
      }, 2500);
    }
  }

  function bindConn() {
    conn.on('open', function () {
      opponentJoined = true;
      netMsg('');
      enterGame();
      if (mode === 'host') {
        waitTip.textContent = '对手已加入！';
        waitTip.style.color = '#7ee6a8';
        showOverlay('对手已就位', '点「开始对战」开打！', '开始对战');
      } else {
        conn.send({ t: 'hello' });
      }
    });
    conn.on('data', onData);
    conn.on('close', function () {
      if (status === 'running') { status = 'over'; }
      showOverlay('对手掉线了', '刷新页面重新创建/加入房间', '知道了');
      btnStart.classList.add('hide');
    });
  }

  function onData(m) {
    if (!m || !m.t) return;
    if (mode === 'host') {
      if (m.t === 'hello') { sendState(); }
      else if (m.t === 'd' && players[1]) setDir(players[1], m.d);
      else if (m.t === 'start') start();
      else if (m.t === 'r') { reset(); start(); }
      else if (m.t === 'wrap') { wrapOn = !!m.on; btnWrap.textContent = '穿墙：' + (wrapOn ? '开' : '关'); btnWrap.classList.toggle('on', wrapOn); sendState(); }
    } else {
      if (m.t === 's') applyState(m);
      else if (m.t === 'p') popToast(m.x);
    }
  }

  // ================= 状态同步 =================
  function sendState() {
    if (mode !== 'host' || !conn || !conn.open) return;
    var msg = {
      t: 's',
      sn: players.map(function (p) {
        return { b: p.snake.map(function (c) { return c.x + ',' + c.y; }).join(';'),
                 d: p.dir, al: p.alive ? 1 : 0, sc: p.score };
      }),
      fd: foods.map(function (f) { return f.x + ',' + f.y; }),
      st: status, wrap: wrapOn ? 1 : 0, time: timeLeft
    };
    if (status === 'over') {
      var p1 = players[0], p2 = players[1];
      if (p1.score === p2.score) {
        msg.over = { win: 0, tip: '势均力敌，再来一局？' };
      } else {
        var w = p1.score > p2.score ? p1 : p2;
        msg.over = {
          win: (w === players[0] ? 1 : 2),
          tip: '比分 ' + p1.score + ' : ' + p2.score + ' · 吃得多者胜'
        };
      }
    }
    conn.send(msg);
  }

  function applyState(m) {
    for (var i = 0; i < 2; i++) {
      var s = m.sn && m.sn[i];
      if (s) {
        players[i].snake = s.b ? s.b.split(';').map(function (p) {
          var a = p.split(','); return { x: +a[0], y: +a[1] };
        }) : [];
        players[i].dir = s.d;
        players[i].alive = !!s.al;
        players[i].score = s.sc || 0;
      }
    }
    foods = (m.fd || []).map(function (p) { var a = p.split(','); return { x: +a[0], y: +a[1], born: 0 }; });
    var prev = status;
    status = m.st;
    wrapOn = !!m.wrap;
    btnWrap.classList.toggle('on', wrapOn);
    if (typeof m.time === 'number') timeLeft = m.time;
    syncHud();
    if (prev !== status) {
      if (status === 'running') hideOverlay();
      else if (status === 'ready') showOverlay('等待房主开始', '房主点击开始后开战', '稍等…');
      else if (status === 'over' && m.over) {
        var myWin = m.over.win === 0 ? null : (m.over.win === mySlot + 1);
        showOverlay(myWin === null ? '平局！' : (myWin ? '你赢了！' : '你输了！'), m.over.tip, '再来一局');
      }
    }
    draw();
  }

  function sendDir(d) {
    if (mode === 'client' && conn && conn.open) conn.send({ t: 'd', d: d });
  }

  // ================= 游戏逻辑（host 端运行） =================
  function reset() {
    players.forEach(function (p, idx) {
      var midY = Math.floor(ROWS / 2);
      var startX = idx === 0 ? 4 : COLS - 5;
      var d = idx === 0 ? 'right' : 'left';
      var dx = d === 'right' ? 1 : -1;
      p.snake = [];
      for (var i = 0; i < 3; i++) p.snake.push({ x: startX - dx * i, y: midY });
      p.dir = p.nextDir = d;
      p.score = 0; p.eaten = 0; p.alive = true; p.deadMsg = '';
    });
    foods = [];
    for (var i = 0; i < FOOD_COUNT; i++) spawnFood();
    interval = BASE_INTERVAL; acc = 0; status = 'ready'; timeLeft = GAME_SECONDS; gameStarted = false;
    syncHud(); draw();
  }

  function start() {
    if (status === 'running') return;
    if (status === 'over') reset();
    if (!gameStarted) {
      endTime = performance.now() + GAME_SECONDS * 1000;
      timeLeft = GAME_SECONDS;
      gameStarted = true;
    }
    status = 'running';
    hideOverlay();
    lastTime = performance.now();
    syncHud(); sendState();
  }

  function endGame() {
    status = 'over';
    var p1 = players[0], p2 = players[1];
    var title, tip;
    if (p1.score === p2.score) {
      title = '平局！';
      tip = '势均力敌，再来一局？';
    } else {
      var w = p1.score > p2.score ? p1 : p2;
      var iWin = (mode === 'host') ? (w === players[0]) : (w === players[1]);
      title = '<span class="w' + (w === players[0] ? '1' : '2') + '">' + (iWin ? '你赢了！' : '你输了！') + '</span>';
      tip = '比分 ' + p1.score + ' : ' + p2.score + ' · 吃得多者胜';
    }
    showOverlay(title, tip, '再来一局');
    sendState();
  }

  function setDir(p, d) {
    if (status !== 'running' || !p.alive) return;
    var opp = { up:'down', down:'up', left:'right', right:'left' };
    if (d === opp[p.dir]) return;
    p.nextDir = d;
  }

  function occupiedMap() {
    var o = {}, i, j;
    for (i = 0; i < players.length; i++)
      for (j = 0; j < players[i].snake.length; j++)
        o[players[i].snake[j].y * COLS + players[i].snake[j].x] = players[i].id;
    for (i = 0; i < foods.length; i++) o[foods[i].y * COLS + foods[i].x] = 99;
    return o;
  }
  function spawnFood() {
    var o = occupiedMap(), free = [];
    for (var y = 0; y < ROWS; y++)
      for (var x = 0; x < COLS; x++)
        if (!o[y * COLS + x]) free.push({ x: x, y: y, born: tick });
    if (!free.length) return;
    foods.push(free[Math.floor(Math.random() * free.length)]);
  }

  function step() {
    var i, j, moves = [];
    for (i = 0; i < players.length; i++) {
      var p = players[i];
      p.dir = p.nextDir;
      var head = p.snake[0], nx = head.x, ny = head.y;
      if (p.dir === 'up') ny--; else if (p.dir === 'down') ny++;
      else if (p.dir === 'left') nx--; else nx++;
      if (wrapOn) { nx = (nx + COLS) % COLS; ny = (ny + ROWS) % ROWS; }
      else if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) { nx = head.x; ny = head.y; } // 撞墙原地不动（不死亡）
      moves.push({ p: p, nx: nx, ny: ny });
    }

    // 只处理吃食物，不再判定任何碰撞死亡（身体/自己/头对头/墙都不会死）
    for (i = 0; i < moves.length; i++) {
      var mv = moves[i];
      mv.eat = -1;
      for (j = 0; j < foods.length; j++)
        if (foods[j].x === mv.nx && foods[j].y === mv.ny) { mv.eat = j; break; }
    }

    for (i = 0; i < moves.length; i++) {
      var mv = moves[i];
      if (mv.nx === mv.p.snake[0].x && mv.ny === mv.p.snake[0].y) continue; // 撞墙原地不动
      mv.p.snake.unshift({ x: mv.nx, y: mv.ny });
      if (mv.eat >= 0) {
        mv.p.score += SCORE_PER_FOOD; mv.p.eaten++;
        praise(mv.p);
        foods.splice(mv.eat, 1);
        spawnFood();
        interval = Math.max(MIN_INTERVAL, BASE_INTERVAL - Math.floor(mv.p.eaten / FOOD_PER_LEVEL) * SPEED_STEP);
      } else mv.p.snake.pop();
    }
    syncHud();

    if (timeLeft <= 0) { endGame(); return; }
    sendState();
  }

  function praise(p) {
    var txt = (mode === 'host' ? (p === players[0] ? '你' : '对手') : (p === players[1] ? '你' : '对手')) +
              '：' + PRAISES[praiseIndex++ % PRAISES.length];
    popToast(txt);
    if (conn && conn.open) conn.send({ t: 'p', x: txt });
  }

  function popToast(txt) {
    toast.textContent = txt;
    toast.classList.remove('pop');
    void toast.offsetWidth;
    toast.classList.add('pop');
  }

  // ================= HUD / 遮罩 =================
  function syncHud() {
    elP1.textContent = players[0].score;
    elP2.textContent = players[1].score;
    document.getElementById('st1').classList.toggle('me', mySlot === 0);
    document.getElementById('st2').classList.toggle('me', mySlot === 1);
    btnStart2.textContent = status === 'running' ? '暂停' : '开始';
    var mm = Math.floor(timeLeft / 60), ss = timeLeft % 60;
    elTimer.textContent = (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
    elTimer.style.color = timeLeft <= 10 ? '#ff6b6b' : '#9aa';
  }
  function showOverlay(title, tip, btn) {
    ovTitle.innerHTML = title; ovTip.innerHTML = tip;
    btnStart.textContent = btn;
    btnStart.classList.remove('hide');
    overlay.classList.remove('hide');
  }
  function hideOverlay() { overlay.classList.add('hide'); }

  function enterGame() {
    elMenu.classList.add('hide');
    elGame.classList.remove('hide');
    updateRotateTip();
    roomTag.textContent = mode === 'host' ? ('房间 ' + roomCodeEl.textContent) : '';
    btnWrap.classList.remove('hide');
    showOverlay(mode === 'host' ? '等待对手加入' : '已连接', mode === 'host' ? '把房间码发给对手' : '等待房主开始…', '开始对战');
    if (mode === 'host') { btnStart.classList.add('hide'); }
    reset();
    setTimeout(resize, 50);
  }

  // ================= 画布 =================
  function resize() {
    var wrapW = stage.clientWidth, wrapH = stage.clientHeight;
    if (wrapW <= 0 || wrapH <= 0) return;
    cell = Math.max(8, Math.floor(Math.min(wrapW / COLS, wrapH / ROWS)));
    var w = cell * COLS, h = cell * ROWS;
    var dpr = window.devicePixelRatio || 1;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
    updateRotateTip();
  }
  function updateRotateTip() {
    var portrait = window.innerHeight > window.innerWidth;
    var inGame = !elGame.classList.contains('hide');
    rotateTip.style.display = (portrait && inGame) ? 'flex' : 'none';
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 150); setTimeout(resize, 420); });
  (function ensure() {
    var n = 0;
    (function t() {
      if (stage.clientHeight > 4 && canvas.width > 0) return;
      resize(); if (++n < 40) requestAnimationFrame(t);
    })();
  })();
  if (window.ResizeObserver) { try { new ResizeObserver(resize).observe(stage); } catch (e) {} }

  function draw() {
    if (!canvas.width) return;
    var w = COLS * cell, h = ROWS * cell;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#1e1e2e';
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var c = 1; c < COLS; c++) { ctx.moveTo(c * cell, 0); ctx.lineTo(c * cell, h); }
    for (var r = 1; r < ROWS; r++) { ctx.moveTo(0, r * cell); ctx.lineTo(w, r * cell); }
    ctx.stroke();

    for (var i = 0; i < foods.length; i++) drawFood(foods[i]);
    for (i = 0; i < players.length; i++) {
      var p = players[i];
      if (!p.alive) ctx.globalAlpha = 0.45;
      for (var k = p.snake.length - 1; k >= 0; k--) drawSegment(p, k);
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = 'rgba(120,130,170,.5)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, w - 2, h - 2);
  }

  function drawFood(f) {
    var pulse = Math.sin(tick * 0.35) * 1.3;
    var r = cell / 2 - 2.5 + pulse;
    var cx = f.x * cell + cell / 2, cy = f.y * cell + cell / 2;
    ctx.fillStyle = '#ff5c5c';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.beginPath(); ctx.arc(cx - r * 0.3, cy - r * 0.35, r * 0.32, 0, Math.PI * 2); ctx.fill();
  }

  function drawSegment(p, index) {
    var len = p.snake.length;
    if (!len) return;
    var t = len <= 1 ? 0 : index / (len - 1);
    var c1 = p.body, c2 = p.head;
    var r = Math.round(c1[0] + (c2[0] - c1[0]) * t);
    var g = Math.round(c1[1] + (c2[1] - c1[1]) * t);
    var b = Math.round(c1[2] + (c2[2] - c1[2]) * t);
    if (index === 0) { r = Math.min(255, c1[0] + 60); g = Math.min(255, c1[1] + 40); b = c1[2]; }
    var x = p.snake[index].x * cell + 1, y = p.snake[index].y * cell + 1;
    var s = cell - 2, rad = s * 0.28;
    ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    roundRect(x, y, s, s, rad);
    ctx.fill();
    if (index === 0) drawEyes(p, x + s / 2, y + s / 2, s);
  }

  function drawEyes(p, cx, cy, s) {
    var fx = 0, fy = 0;
    if (p.dir === 'up') fy = -1; else if (p.dir === 'down') fy = 1;
    else if (p.dir === 'left') fx = -1; else fx = 1;
    var px = -fy, py = fx;
    var off = s * 0.16, side = s * 0.15;
    for (var k = -1; k <= 1; k += 2) {
      var ex = cx + fx * off + px * side * k;
      var ey = cy + fy * off + py * side * k;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex, ey, s * 0.10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#243030';
      ctx.beginPath(); ctx.arc(ex + fx * s * 0.04, ey + fy * s * 0.04, s * 0.048, 0, Math.PI * 2); ctx.fill();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ================= 主循环（host 模拟，client 只重绘动画） =================
  function loop(now) {
    requestAnimationFrame(loop);
    var dt = now - lastTime;
    lastTime = now;
    if (dt > 300) dt = 300;
    if (mode === 'host' && status === 'running') {
      timeLeft = Math.max(0, Math.ceil((endTime - performance.now()) / 1000));
      tick++;
      acc += dt;
      while (acc >= interval) {
        acc -= interval;
        step();
        if (status !== 'running') break;
      }
      syncHud();
      draw();
    } else { tick++; draw(); }
  }

  // ================= 摇杆 =================
  var joyId = null;
  function joyDir(d) {
    var p = players[mySlot];
    if (mode === 'host') setDir(p, d);
    else sendDir(d);
  }
  function joyMove(cx, cy) {
    var rect = joy.getBoundingClientRect();
    var dx = cx - (rect.left + rect.width / 2);
    var dy = cy - (rect.top + rect.height / 2);
    var dist = Math.sqrt(dx * dx + dy * dy);
    var joyR = rect.width / 2, knobR = 24;
    var maxDist = Math.max(1, joyR - knobR);
    var kx = dx, ky = dy;
    if (dist > maxDist) { kx = dx / dist * maxDist; ky = dy / dist * maxDist; }
    knob.style.transform = 'translate(' + kx + 'px,' + ky + 'px)';
    if (dist < 10) return;
    if (Math.abs(dx) > Math.abs(dy)) joyDir(dx > 0 ? 'right' : 'left');
    else joyDir(dy > 0 ? 'down' : 'up');
  }
  function joyReset() { knob.style.transform = 'translate(0px,0px)'; }

  if (window.PointerEvent) {
    joy.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (joyId !== null) return;
      joyId = e.pointerId;
      try { joy.setPointerCapture(e.pointerId); } catch (err) {}
      joy.classList.add('active');
      joyMove(e.clientX, e.clientY);
    });
    joy.addEventListener('pointermove', function (e) {
      if (e.pointerId !== joyId) return;
      e.preventDefault(); joyMove(e.clientX, e.clientY);
    });
    function up(e) {
      if (e.pointerId !== joyId) return;
      joyId = null; joy.classList.remove('active'); joyReset();
    }
    joy.addEventListener('pointerup', up);
    joy.addEventListener('pointercancel', up);
    joy.addEventListener('lostpointercapture', up);
  } else {
    var tid = null;
    joy.addEventListener('touchstart', function (e) {
      e.preventDefault();
      if (tid !== null) return;
      tid = e.changedTouches[0].identifier;
      joy.classList.add('active');
      joyMove(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
    }, { passive: false });
    joy.addEventListener('touchmove', function (e) {
      e.preventDefault();
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (t.identifier === tid) joyMove(t.clientX, t.clientY);
      }
    }, { passive: false });
    function end(e) {
      for (var i = 0; i < e.changedTouches.length; i++)
        if (e.changedTouches[i].identifier === tid) { tid = null; joy.classList.remove('active'); joyReset(); }
    }
    joy.addEventListener('touchend', end, { passive: false });
    joy.addEventListener('touchcancel', end, { passive: false });
  }

  // ================= 键盘 =================
  window.addEventListener('keydown', function (e) {
    var k = e.key;
    var map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
                w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right' };
    if (map[k]) { joyDir(map[k]); e.preventDefault(); }
    if (k === 'r' || k === 'R') {
      if (mode === 'host') { reset(); start(); }
      else if (conn && conn.open) conn.send({ t: 'r' });
    }
  });

  // ================= 按钮 =================
  btnHost.addEventListener('click', beHost);
  btnJoin.addEventListener('click', joinRoom);
  inCode.addEventListener('input', function () { netMsg(''); });

  btnStart.addEventListener('click', function () {
    if (mode === 'host') { if (!opponentJoined) { showOverlay('还差一个对手', '先把房间码发给ta吧', '知道了'); return; } start(); }
    else if (conn && conn.open) conn.send({ t: 'start' });
  });
  btnStart2.addEventListener('click', function () {
    if (mode === 'host') {
      if (status === 'running') { status = 'ready'; showOverlay('已暂停', '休息一下～', '继续对战'); sendState(); }
      else start();
      syncHud();
    } else if (conn && conn.open) conn.send({ t: 'start' });
  });
  btnRestart.addEventListener('click', function () {
    if (mode === 'host') { reset(); start(); }
    else if (conn && conn.open) conn.send({ t: 'r' });
  });
  btnWrap.addEventListener('click', function () {
    var next = !wrapOn;
    if (mode === 'host') {
      wrapOn = next;
      btnWrap.textContent = '穿墙：' + (wrapOn ? '开' : '关');
      btnWrap.classList.toggle('on', wrapOn);
      sendState();
    } else if (conn && conn.open) {
      conn.send({ t: 'wrap', on: next });
    }
  });

  btnFs.addEventListener('click', function () {
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (!req) {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function () {});
      } else {
        alert('当前浏览器不支持网页全屏：iPhone 的 Safari 不支持此功能，请直接横屏手机即可游玩；安卓请用 Chrome 浏览器。');
      }
      return;
    }
    try {
      var p = req.call(el);
      if (p && p.then) p.catch(function () {});
    } catch (e) {}
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(function () {});
    }
  });

  document.addEventListener('touchmove', function (e) {
    if (e.target === canvas || e.target.closest('#joystick')) e.preventDefault();
  }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  // ================= 启动 =================
  reset();
  lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
